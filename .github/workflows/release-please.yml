name: Release Please

on:
  push:
    branches:
      - main
  # Publish a workspace by hand, like a maintenance release from a branch other than main.
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace to publish
        required: true
        type: choice
        options:
          - workspaces/adapter
          - workspaces/conflicter
          - workspaces/eslint
          - workspaces/namespace
          - workspaces/transform
          - workspaces/types
      dist-tag:
        description: npm dist-tag to publish with (latest only from main)
        required: true
        type: string
      branch:
        description: Branch to publish from
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      head_branch: ${{ fromJson(steps.release.outputs.pr || '{}').headBranchName }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prettify-pr:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.head_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm install
      - run: npx prettier --write .
      - name: Fix lint on Release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: fix code style issues"
          git push origin

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm test
      - name: Publish with provenance
        run: npm publish --workspace=${{ join(fromJson(needs.release-please.outputs.paths_released), ' --workspace=') }} --provenance --access public

  manual-publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the release tag
      id-token: write # Required for npm provenance
    env:
      WORKSPACE: ${{ inputs.workspace }}
      DIST_TAG: ${{ inputs.dist-tag }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the release
        id: release
        run: |
          name=$(node -p "require('./$WORKSPACE/package.json').name")
          version=$(node -p "require('./$WORKSPACE/package.json').version")
          tag="$name@$version"
          if [ "$DIST_TAG" = latest ] && [ "$BRANCH" != main ]; then
            echo "::error::The latest dist-tag is only published from main, $BRANCH needs another dist-tag"
            exit 1
          fi
          if [ -n "$(npm view "$tag" version 2>/dev/null)" ]; then
            echo "::error::$tag is already published"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::The git tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npm test
      - name: Publish with provenance
        run: npm publish --workspace="$WORKSPACE" --tag "$DIST_TAG" --provenance --access public
      - name: Push the release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
